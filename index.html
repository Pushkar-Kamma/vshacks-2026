<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Candid — everyone's best photos, together</title>
    <meta name="description" content="Candid pools everyone's photos and automatically keeps the best — including the ones you're in." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- HOME -->
    <section id="screen-home" class="screen">
      <div class="aurora" aria-hidden="true">
        <div class="blob b1"></div>
        <div class="blob b2"></div>
        <div class="blob b3"></div>
      </div>
      <div id="photo-stream" class="photo-stream" aria-hidden="true"></div>
      <div class="hero-veil" aria-hidden="true"></div>
      <div class="home-inner">
        <div class="hero-head">
          <h1 class="brandmark">Candid</h1>
          <p class="tagline">The group album that makes itself.</p>
        </div>
        <button id="btn-start" class="btn btn-primary">Start a session →</button>
        <div class="join-row">
          <input id="join-code" class="input" placeholder="Have a code? e.g. SUN-4821" autocomplete="off" />
          <button id="btn-join" class="btn btn-ghost">Join</button>
        </div>
        <p class="home-foot">No app · No account · Just memories</p>
      </div>
    </section>

    <!-- ROOM -->
    <section id="screen-room" class="screen hidden">
      <header class="room-bar">
        <div class="room-left">
          <button id="btn-leave" class="leave-btn" title="Leave session" aria-label="Leave session">‹</button>
          <div class="room-title">
            <span id="room-name">Session</span>
            <span id="room-code" class="room-code"></span>
          </div>
        </div>
        <div class="room-actions">
          <div id="me-chip" class="me-chip" role="button" tabindex="0" title="Click to rename yourself">
            <span id="me-dot" class="dot"></span><span id="me-name">You</span>
          </div>
          <span id="member-avatars" class="avatars"></span>
          <button id="btn-invite" class="icon-btn" title="Invite">Invite</button>
        </div>
      </header>

      <div class="controls">
        <div class="toggle" role="tablist">
          <span class="toggle-glide" aria-hidden="true"></span>
          <button id="tab-best" class="toggle-opt active">⭐ Best <span id="count-best">0</span></button>
          <button id="tab-all" class="toggle-opt">All <span id="count-all">0</span></button>
        </div>
        <div class="control-actions">
          <button id="btn-me" class="ctl-btn" title="Photos of you">📸</button>
          <button id="btn-slideshow" class="ctl-btn" title="Play a slideshow">▶</button>
          <button id="btn-download" class="ctl-btn" title="Download">⬇</button>
        </div>
      </div>

      <div id="filter-row" class="filter-row"></div>

      <main id="grid" class="grid"></main>
      <div id="empty" class="empty hidden">
        <p>No photos yet.</p>
        <p class="muted">Tap ➕ to add the first ones.</p>
      </div>

      <nav class="toolbar">
        <button id="btn-add" class="tool-add">＋ Add photos</button>
      </nav>
      <input id="file-input" type="file" accept="image/*" multiple hidden />
    </section>

    <!-- INVITE / QR -->
    <div id="modal-qr" class="modal hidden">
      <div class="modal-card">
        <button class="modal-close" data-close>✕</button>
        <h2>Invite your crew</h2>
        <div id="qr" class="qr"></div>
        <p class="room-code big" id="qr-code"></p>
        <button id="btn-copy" class="btn btn-ghost">Copy link</button>
      </div>
    </div>

    <!-- LOUPE -->
    <div id="modal-loupe" class="modal loupe hidden">
      <button class="modal-close" data-close>✕</button>
      <button id="loupe-prev" class="loupe-nav prev">‹</button>
      <img id="loupe-img" class="loupe-img" alt="" />
      <button id="loupe-next" class="loupe-nav next">›</button>
      <div class="loupe-info">
        <span id="loupe-owner"></span>
        <button id="loupe-angles" class="chip hidden"></button>
        <button id="loupe-download" class="chip">⬇ Save</button>
        <button id="loupe-delete" class="chip">🗑 Delete</button>
      </div>
    </div>

    <!-- PHOTOS OF YOU -->
    <div id="modal-selfie" class="modal hidden">
      <div class="modal-card">
        <button class="modal-close" data-close>✕</button>
        <h2>Find photos of you</h2>
        <p class="muted">Center your face and hold still for a quick scan. It never leaves your device — it's only used to find you in the pool.</p>
        <video id="selfie-video" class="selfie-video" autoplay playsinline muted></video>
        <button id="btn-capture" class="btn btn-primary">Scan my face</button>
        <p id="selfie-status" class="muted"></p>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script>

    <!-- Our code -->
    <script src="supabase-config.js"></script>
    <script src="curate.js"></script>
    <script src="names.js"></script>
    <script src="store.js"></script>
    <script src="faces.js"></script>
    <script src="script.js"></script>
  </body>
</html>
